<script>
// Forge serves worker script files with its default CSP (no unsafe-eval), so the worker could not compile WebAssembly.
// A worker made from a blob: URL inherits this page's policy instead. Same code as stochcraft-worker_loader.js, absolute URLs.
(function () {
  const W = window.Worker;
  window.Worker = function (url, opts) {
    if (/stochcraft-worker_loader\.js$/.test(String(url))) {
      const base = new URL('./', location.href).href;
      const code = 'importScripts(' + JSON.stringify(base + 'stochcraft-worker.js') + ');wasm_bindgen(' + JSON.stringify(base + 'stochcraft-worker_bg.wasm') + ');';
      return new W(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })), opts);
    }
    return new W(url, opts);
  };
  window.Worker.prototype = W.prototype;
})();
</script>
